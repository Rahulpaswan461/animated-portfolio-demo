<!doctype html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0c0b" />

    <script>
      // Resolve the theme before first paint so there is no flash of the wrong
      // one. Stored choice wins; otherwise follow the OS.
      (function () {
        try {
          var stored = localStorage.getItem("rp-theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.dataset.theme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", theme === "light" ? "#f7f6f2" : "#0c0c0b");
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>

    <!--
      Cabinet Grotesk (display) + Satoshi (text) from Fontshare, JetBrains Mono
      for metadata. Deliberately not Inter or Instrument Serif: that pairing has
      become the default look of generated sites.
    -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      One request per family on purpose: Fontshare's API silently drops the
      second f[] when two families are combined, which loads the CSS with no
      error and leaves the display face falling back.
    -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@800,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
